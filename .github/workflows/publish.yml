name: Publish images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: ./server
          - name: web
            context: ./web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/geoloc-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=tag

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  cleanup:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep only the 6 most recent workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const keep = 6;
            const { owner, repo } = context.repo;
            const runs = [];
            for (let page = 1; page <= 10; page += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
                page,
              });
              runs.push(...data.workflow_runs);
              if (data.workflow_runs.length < 100) break;
            }
            const completed = runs
              .filter((run) => run.status === 'completed')
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const toDelete = completed.slice(keep);
            core.info(`Runs: ${runs.length}, à supprimer: ${toDelete.length}`);
            for (const run of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                core.info(`Run ${run.id} (${run.name} #${run.run_number}) supprimé`);
              } catch (error) {
                core.warning(`Suppression du run ${run.id} impossible: ${error.message}`);
              }
            }
