services:
  server:
    image: ghcr.io/didier57/geoloc-server:${GEOLOC_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      SERVER_PORT: ${SERVER_PORT:-4000}
      TZ: ${TZ:-Europe/Paris}
      APP_TZ: ${APP_TZ:-Europe/Paris}
      APP_URL: ${APP_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET}
      COOKIE_ENC_KEY: ${COOKIE_ENC_KEY}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DATA_FILE: /data/geoloc.json
      DB_FILE: /data/geoloc.db
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-7}
      DB_BACKUP_INTERVAL_HOURS: ${DB_BACKUP_INTERVAL_HOURS:-24}
      ARCHIVE_BACKFILL_DAYS: ${ARCHIVE_BACKFILL_DAYS:-8}
      STILL_MAX_KMH: ${STILL_MAX_KMH:-2}
      WALK_MAX_KMH: ${WALK_MAX_KMH:-8}
    volumes:
      - geoloc_data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    image: ghcr.io/didier57/geoloc-web:${GEOLOC_IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - server
    environment:
      SERVER_UPSTREAM: server:4000
    ports:
      - "8080:80"

volumes:
  geoloc_data:
